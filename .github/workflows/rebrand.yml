name: OwnTV Rebrand

# Builds the rebrand toolchain image on GitHub Actions, then runs it to produce
# rebranded release APKs and publish them to the target repo.
#
# CI only builds the image; all rebranding happens inside the container when it
# runs: it pulls the project, renames activities/package/applicationId, generates
# a fresh signing key, builds the release APKs and pushes them to TARGET_REPO.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   GPR_USER        GitHub packages username with read access to ahXN00/OwnTV_Core
#   GPR_TOKEN       Read token for the OwnTV core deps (tv.own.owntv:core/:player-core)
#   GH_TOKEN        Token with push access to the TARGET_REPO below
#
# No permanent keystore is used: every run signs with a newly generated key.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version (VERSION_NAME)
        type: string
        default: "1.0.0"
      version_code:
        description: Release code (VERSION_CODE)
        type: number
        default: 100
      target_repo:
        description: Repo to publish the APKs to
        type: string
        default: axentless-sketch/OwnTV
      source_branch:
        description: Source branch to rebrand from
        type: string
        default: main

permissions:
  contents: read
  packages: write # build + push the toolchain image to GHCR
  actions: write  # docker-container buildx cache export (type=gha)

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/owntv-rebrand

jobs:
  build-image:
    name: Build rebrand toolchain image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: rebrand
          file: rebrand/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            gh_token=${{ secrets.GH_TOKEN }}
            gpr_user=${{ secrets.GPR_USER }}
            gpr_token=${{ secrets.GPR_TOKEN }}

  rebrand:
    name: Rebrand and publish APKs
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Prepare work dir
        run: mkdir -p "$RUNNER_TEMP/owntv-work"
      - name: Pull toolchain image
        run: docker pull "$IMAGE:${{ github.sha }}"
        env:
          IMAGE: ${{ env.IMAGE }}
      - name: Run rebrand pipeline
        run: >
          docker run --rm
          -e GH_TOKEN="${{ secrets.GH_TOKEN }}"
          -e GPR_USER="${{ secrets.GPR_USER }}"
          -e GPR_TOKEN="${{ secrets.GPR_TOKEN }}"
          -e TARGET_REPO="${{ inputs.target_repo || 'axentless-sketch/OwnTV' }}"
          -e SOURCE_BRANCH="${{ inputs.source_branch || 'main' }}"
          -e VERSION_NAME="${{ inputs.version_name || '1.0.0' }}"
          -e VERSION_CODE="${{ inputs.version_code || 100 }}"
          -v "$RUNNER_TEMP/owntv-work:/work"
          "${{ env.IMAGE }}:${{ github.sha }}"
      - name: Upload APKs and signing info
        uses: actions/upload-artifact@v4
        with:
          name: owntv-rebranded-apks
          path: |
            ${{ runner.temp }}/owntv-work/out/*.apk
            ${{ runner.temp }}/owntv-work/out/signing.txt
          if-no-files-found: error